# Uploads the HubSpot page templates to Design Manager whenever they change on main,
# so a merge to main goes live without copy and paste.
# Needs the repository secret HUBSPOT_PERSONAL_ACCESS_KEY (Design Manager scope).
# Run it by hand from the Actions tab with "Run workflow".
name: Deploy to HubSpot

on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'tools/**'
      - '*/page.yaml'
      - 'sfn-2026/hubspot/**'
      - 'ascb-cell-bio-2026/hubspot/**'
      - '.github/workflows/deploy-hubspot.yml'
  workflow_dispatch:

concurrency:
  group: hubspot-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUBSPOT_ACCOUNT_ID: '39765345'
      HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
      HS_CLI: '@hubspot/cli@8.18.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the access key is set
        run: |
          if [ -z "$HUBSPOT_PERSONAL_ACCESS_KEY" ]; then
            echo "::error::Add the HUBSPOT_PERSONAL_ACCESS_KEY secret under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pages are generated from page.yaml + shared/; refuse to deploy anything that wasn't rebuilt
      - name: Check every page is built from its content and the shared components
        run: |
          pip install --quiet -r tools/requirements.txt
          python3 tools/build-pages.py --check

      - name: Upload SfN 2026 template
        run: npx --yes --package "$HS_CLI" hs cms upload sfn-2026/hubspot/sfn-2026-paste-into-design-manager.html "Landing Pages/sfn-2026.html" --use-env

      - name: Upload ASCB Cell Bio 2026 template
        run: npx --yes --package "$HS_CLI" hs cms upload ascb-cell-bio-2026/hubspot/ascb-cell-bio-2026-paste-into-design-manager.html "Landing Pages/ascb-cell-bio-2026.html" --use-env
