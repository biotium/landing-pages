sections:
  - type: portfolio
    kicker: Portfolio
    title: Simplify cell biology research with innovative tools
    cards:
      - title: Nuclear Stains
        text: Bright, wash-free nuclear counterstains with minimal spectral overlap for easy multiplexing.
        image: nuclear_sm.jpg
        href: https://biotium.com/technology/cellular-stains/nuclear-stains/
      - title: Membrane Stains
        text: Lipophilic dyes and CytoLiner&trade; conjugates that label the plasma membrane, live or fixed.
        image: membrane_sm.jpg
        href: https://biotium.com/technology/cellular-stains/cell-surface-stains/
      - title: Antibodies
        text: Validated primary and secondary conjugates, ready to use straight off the shelf.
        image: antibody_sm.jpg
        href: https://biotium.com/technology/primary-secondary-antibody-conjugates/
      - title: Flow Cytometry
        text: Multiplex up to 15 samples in one tube with fixable viability dyes and bright conjugates.
        image: flow_sm.jpg
        href: https://biotium.com/technology/flow-cytometry-reagents/
      - title: Exosome &amp; EV Detection
        text: Detect and quantify exosomes and EVs without ultracentrifugation or bulky isolation kits.
        image: evs_sm.jpg
        href: https://biotium.com/technology/exosome-ev-labeling/
      - title: Signal Amplification
        text: Tyramide-based amplification that boosts faint signals while keeping resolution sharp.
        image: tsa_sm.jpg
        href: https://biotium.com/technology/primary-secondary-antibody-conjugates/tyramide-signal-amplification/

  - type: resources
    kicker: Take it with you
    title: Free guides for the show and after
    cards:
      - title: Cell Stain Selection Guide
        text: Comparison charts and a cellular diagram to match stains to your target, organism, and application at a glance.
        href: https://biotium.com/wp-content/uploads/2020/01/CellStainsGuide_WebVersion.pdf
      - title: Cell Stains Under the Hood
        text: Illustrated staining mechanisms for viability, organelle, and apoptosis dyes, with guidance on choosing the right one.
        href: https://biotium.com/wp-content/uploads/2024/10/Biotium-Stains_Dyes_Guide-Final-web-version.pdf
      - title: CF&reg; Dyes &amp; Cell Stains for Microscopy
        text: Excitation and emission spectra for 40+ CF&reg; Dyes and cell stains, plus laser and filter guidance for microscopy.
        href: https://biotium.com/wp-content/uploads/2024/11/CF-Dyes-for-Microscopy-Web.pdf

  - type: merch
    id: merch
    image: tshirts.webp
    alt: Biotium spectra and TrueBlack conference T-shirts
    kicker: Win cool merch
    title: Come play Lab DnD for a chance to win a limited release tee and other prizes
    lead: Stop by our booth to play for a chance to win various prizes, including our limited-release T-shirts, while supplies last.

  - type: say-hi
    title: Come say hi. Bring your questions.
    lead: Walk up any time. Talk to our team, PhD scientists included, and play a quick game for a chance to win prizes, maybe even a T-shirt. We want to hear what challenges you&rsquo;re running into in your research, whether we already have a solution or need to build one.
    note: No forms. No sales pitch. Just come find us at Booth 1216.

