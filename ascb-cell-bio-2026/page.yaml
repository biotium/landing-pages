sections:
  - type: portfolio
    id: products
    kicker: Products
    title: Simplify cell biology research with innovative tools
    cards:
      - title: Cellular Stains
        text: Nuclear, membrane, and cytoskeleton stains for live and fixed cells, built for easy multiplexing.
        image: membrane_sm.jpg
        href: https://biotium.com/technology/cellular-stains/
      - title: Biotium Choice Antibodies &amp; MiniMabs
        text: Carefully curated, in-house validated primary antibodies, plus compact single-domain MiniMabs.
        image: antibody_sm.jpg
        href: https://biotium.com/primary-antibodies/
      # Stand-in image until the CF Dyes art is ready
      - title: CF&reg; Dyes &amp; Antibody Labeling Kits
        text: Bright, photostable CF&reg; Dyes and Mix-n-Stain&trade; kits to label your own antibodies.
        image: tsa_sm.jpg
        href: https://biotium.com/technology/cf-dyes/
      # Stand-in image until the secondary antibodies art is ready
      - title: Secondary Antibodies
        text: CF&reg; Dye-conjugated secondaries across host species and colors, ready for your multiplex panel.
        image: nuclear_sm.jpg
        href: https://biotium.com/technology/primary-secondary-antibody-conjugates/secondary-antibody-product-listings/
      # Stand-in image until the TrueBlack art is ready
      - title: TrueBlack&reg;
        text: Quench lipofuscin autofluorescence and cut nonspecific background for cleaner IF and western blots.
        image: evs_sm.jpg
        href: https://biotium.com/technology/trueblack-fluorescence-background-reducing-reagents/
      # Stand-in image until the cell viability art is ready
      - title: Cell Viability
        text: Live and dead stains plus apoptosis and necrosis assays for microscopy and flow cytometry.
        image: flow_sm.jpg
        href: https://biotium.com/technology/cell-viability-apoptosis/

  - type: resources
    kicker: Take it with you
    title: Free guides for the show and after
    cards:
      - title: Cell Stain Selection Guide
        text: Comparison charts and a cellular diagram to match stains to your target, organism, and application at a glance.
        href: https://biotium.com/wp-content/uploads/2020/01/CellStainsGuide_WebVersion.pdf
      - title: Cell Stains Under the Hood
        text: Illustrated staining mechanisms for viability, organelle, and apoptosis dyes, with guidance on choosing the right one.
        href: https://biotium.com/wp-content/uploads/2024/10/Biotium-Stains_Dyes_Guide-Final-web-version.pdf
      - title: CF&reg; Dyes &amp; Cell Stains for Microscopy
        text: Excitation and emission spectra for 40+ CF&reg; Dyes and cell stains, plus laser and filter guidance for microscopy.
        href: https://biotium.com/wp-content/uploads/2024/11/CF-Dyes-for-Microscopy-Web.pdf

  - type: merch
    id: merch
    image: tshirts.webp
    alt: Biotium spectra and TrueBlack conference T-shirts
    kicker: Win cool merch
    title: Come play Lab DnD for a chance to win a limited release tee and other prizes
    lead: Stop by our booth to play for a chance to win various prizes, including our limited-release T-shirts, while supplies last.

  - type: say-hi
    title: Come say hi. Bring your questions.
    lead: Walk up any time. Talk to our team, PhD scientists included, and play a quick game for a chance to win prizes, maybe even a T-shirt. We want to hear what challenges you&rsquo;re running into in your research, whether we already have a solution or need to build one.
    note: Real scientists. Real answers. No sales pitch.

  - type: ask-form
    kicker: Ask a scientist
    title: Let our scientists do the searching
    lead: Our support scientists will review what you&rsquo;re working on and send you personalized product and protocol picks.
    placeholder: "Cell type or model, target, imaging method, and where you&rsquo;re stuck. Example: live-cell imaging of mitochondria in primary fibroblasts, need a brighter far-red stain."
