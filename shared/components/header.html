{% import '_icons.html' as i %}
<!-- Top header: logo, tagline, and (phones only) the booth pill -->
<div id="top-header">
  <div id="header-inner" class="bt-wrap">
    <a id="header-logo" href="https://biotium.com" aria-label="Biotium home">
      {% include '_logo-header.svg' %}
    </a>
    <span class="bt-tagline-top">Glowing Products for Science&trade;</span>
    <a class="bt-booth-pill bt-booth-pill--top" href="{{ event.floor_plan }}" target="_blank" rel="noopener" aria-label="Booth {{ event.booth }}, open the {{ event.short_name }} floor plan">
      {{ i.pin('currentColor') }}
      <span>Booth {{ event.booth }}</span>
    </a>
  </div>
</div>
